var POS = [[60, 28], [88, 44], [90, 74], [62, 92], [32, 78], [30, 48], [60, 60], [44, 42], [76, 62], [46, 76]];
var OTHER = {
  "Tacos poulet": '<path d="M12 80 A48 48 0 0 1 108 80 Z" fill="#e9c27a"/><path d="M22 80 A38 38 0 0 1 98 80 Z" fill="#6fbf4a"/><rect x="30" y="52" width="10" height="8" rx="3" fill="#c48b57"/><rect x="50" y="46" width="10" height="8" rx="3" fill="#c48b57"/><rect x="70" y="54" width="10" height="8" rx="3" fill="#c48b57"/><g stroke="#ffc82e" stroke-width="5" stroke-linecap="round"><path d="M34 34 L28 18"/><path d="M60 30 L60 12"/><path d="M86 34 L94 18"/></g>',
  "Tacos mixte": '<path d="M12 80 A48 48 0 0 1 108 80 Z" fill="#e9c27a"/><path d="M22 80 A38 38 0 0 1 98 80 Z" fill="#ffcf5a"/><rect x="30" y="52" width="10" height="8" rx="3" fill="#c48b57"/><circle cx="58" cy="52" r="6" fill="#a81f19"/><rect x="72" y="54" width="10" height="8" rx="3" fill="#c48b57"/><g stroke="#ffc82e" stroke-width="5" stroke-linecap="round"><path d="M34 34 L28 18"/><path d="M60 30 L60 12"/><path d="M86 34 L94 18"/></g>',
  "Sandwich escalope": '<rect x="14" y="80" width="92" height="18" rx="9" fill="#d9a45b"/><rect x="14" y="66" width="92" height="8" rx="4" fill="#6fbf4a"/><rect x="18" y="52" width="84" height="14" rx="6" fill="#e0a25a"/><rect x="22" y="44" width="76" height="8" rx="4" fill="#e8483a"/><path d="M12 44 Q60 -4 108 44 Z" fill="#e8b468"/>',
  "Burger maison": '<path d="M16 54 Q60 2 104 54 Z" fill="#e0a04e"/><g fill="#fff3d6"><ellipse cx="44" cy="36" rx="3" ry="1.6"/><ellipse cx="62" cy="28" rx="3" ry="1.6"/><ellipse cx="78" cy="38" rx="3" ry="1.6"/></g><rect x="14" y="54" width="92" height="8" rx="4" fill="#6fbf4a"/><path d="M16 62 H104 L96 74 H24 Z" fill="#ffc400"/><rect x="16" y="72" width="88" height="12" rx="6" fill="#6b3a22"/><rect x="16" y="86" width="88" height="14" rx="7" fill="#d9954a"/>',
  "Tiramisu": '<rect x="18" y="26" width="84" height="16" rx="4" fill="#5a3623"/><rect x="18" y="42" width="84" height="14" fill="#f6e9cf"/><rect x="18" y="56" width="84" height="12" fill="#c58b55"/><rect x="18" y="68" width="84" height="14" fill="#f6e9cf"/><rect x="18" y="82" width="84" height="14" rx="4" fill="#c58b55"/>',

  "Eau minérale 50 cl": '<rect x="50" y="10" width="20" height="10" rx="3" fill="#2f6fd6"/><path d="M46 20 H74 L80 34 V100 Q80 108 72 108 H48 Q40 108 40 100 V34 Z" fill="#bfe3ff"/><rect x="40" y="52" width="40" height="22" fill="#2f6fd6"/>',

  "Jus de fruits": '<path d="M34 34 H86 L80 104 H40 Z" fill="#ffb02e"/><path d="M34 34 H86 L84 50 H36 Z" fill="#ffe08a"/><path d="M70 6 L62 34" stroke="#e8483a" stroke-width="5" stroke-linecap="round"/>'
};
function art(it) {
  var key = it.n[0], name = it.n[IDX[lang]];
  if (PHOTOS[key]) return '<img src="' + PHOTOS[key] + '" alt="' + name + '" loading="lazy">';
  var s = "";
  if (PIZZAS[key]) {
    var tops = PIZZAS[key];
    s = '<circle cx="60" cy="60" r="54" fill="#e3a23b"/><circle cx="60" cy="60" r="47" fill="#d4402b"/><circle cx="60" cy="60" r="44" fill="#ffd25f"/>';
    POS.forEach(function (p, i) { s += TOP[tops[i % tops.length]](p[0], p[1]); });
  } else { s = OTHER[key] || ""; }
  return '<svg viewBox="0 0 120 120" role="img" aria-label="' + name + '">' + s + '</svg>';
}

var cart = {}; // clé -> { it, si, price, qty }
var cur = 0;
var $ = function (id) { return document.getElementById(id); };
function t(k) { return T[lang][k]; }
function tr(a) { return a[IDX[lang]]; }
function fmt(n) { return n.toLocaleString("fr-FR") + " " + (lang === "ar" ? "دج" : "DA"); }
function fmtFR(n) { return (n.toLocaleString("fr-FR") + " DA").replace(/\s/g, " "); }

function applyStatic() {
  var h = document.documentElement;
  h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-ph]").forEach(function (el) { el.placeholder = t(el.getAttribute("data-ph")); });
  document.querySelectorAll("[data-aria]").forEach(function (el) { el.setAttribute("aria-label", t(el.getAttribute("data-aria"))); });
  document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
}

function buildTabs() {
  var tabs = $("tabs"); tabs.innerHTML = "";
  MENU.forEach(function (c, ci) {
    var b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.textContent = tr(c.label);
    b.setAttribute("role", "tab"); b.setAttribute("aria-selected", ci === cur ? "true" : "false");
    b.onclick = function () { cur = ci; markTabs(); showCat(); };
    tabs.appendChild(b);
  });
}
function markTabs() {
  Array.prototype.forEach.call($("tabs").children, function (b, i) { b.setAttribute("aria-selected", i === cur ? "true" : "false"); });
}

function showCat() {
  var menu = $("menu"), c = MENU[cur];
  menu.innerHTML = "";
  var h = document.createElement("h2"); h.textContent = tr(c.label); menu.appendChild(h);
  if (tr(c.sub)) { var s = document.createElement("p"); s.className = "sub"; s.textContent = tr(c.sub); menu.appendChild(s); }
  c.items.forEach(function (it) {
    var row = document.createElement("div"); row.className = "item";
    var pic = document.createElement("div"); pic.className = "pic"; pic.innerHTML = art(it);
    var left = document.createElement("div");
    var h3 = document.createElement("h3"); h3.textContent = tr(it.n);
    if (it.tag) { var b = document.createElement("span"); b.className = "badge"; b.textContent = tr(it.tag); h3.appendChild(b); }
    left.appendChild(h3);
    if (tr(it.d)) { var p = document.createElement("p"); p.textContent = tr(it.d); left.appendChild(p); }
    var buy = document.createElement("div"); buy.className = "buy";
    it.p.forEach(function (price, i) {
      var btn = document.createElement("button"); btn.type = "button";
      var size = it.p.length > 1 ? tr(SIZES[i]) : "";
      btn.innerHTML = (size ? "<small>" + size + "</small>" : "") + fmt(price);
      btn.setAttribute("aria-label", t("add") + " " + tr(it.n) + (size ? " " + size : "") + ", " + fmt(price));
      btn.onclick = function () { add(it, it.p.length > 1 ? i : -1, price); };
      buy.appendChild(btn);
    });
    row.appendChild(pic); row.appendChild(left); row.appendChild(buy); menu.appendChild(row);
  });
}

function add(it, si, price) {
  var k = it.n[0] + "|" + si;
  if (!cart[k]) cart[k] = { it: it, si: si, price: price, qty: 0 };
  cart[k].qty++;
  update();
}
function change(k, d) {
  cart[k].qty += d;
  if (cart[k].qty <= 0) delete cart[k];
  update();
}
function totals() {
  var count = 0, sub = 0;
  Object.keys(cart).forEach(function (k) { count += cart[k].qty; sub += cart[k].qty * cart[k].price; });
  var delivery = document.querySelector('input[name="mode"]:checked').value === "livraison";
  return { count: count, sub: sub, delivery: delivery, fee: delivery && sub ? DELIVERY_FEE : 0 };
}

function update() {
  var t0 = totals(), keys = Object.keys(cart);
  $("bar").hidden = t0.count === 0 || !$("sheet").hidden;
  $("barCount").textContent = t0.count + " " + (t0.count > 1 ? t("items") : t("item"));
  $("barTotal").textContent = fmt(t0.sub);

  var box = $("lines"); box.innerHTML = "";
  if (!keys.length) { var e = document.createElement("p"); e.className = "empty"; e.textContent = t("empty"); box.appendChild(e); }
  keys.forEach(function (k) {
    var l = cart[k], nm = tr(l.it.n), sz = l.si > -1 ? tr(SIZES[l.si]) : "";
    var d = document.createElement("div"); d.className = "line";
    var left = document.createElement("div");
    var b = document.createElement("b"); b.textContent = nm;
    var sm = document.createElement("small"); sm.textContent = (sz ? sz + " · " : "") + fmt(l.price);
    left.appendChild(b); left.appendChild(sm);
    var q = document.createElement("div"); q.className = "qty";
    var m = document.createElement("button"); m.type = "button"; m.textContent = "−"; m.setAttribute("aria-label", t("rem") + " " + nm);
    var n = document.createElement("span"); n.textContent = l.qty;
    var p = document.createElement("button"); p.type = "button"; p.textContent = "+"; p.setAttribute("aria-label", t("add") + " " + nm);
    m.onclick = function () { change(k, -1); }; p.onclick = function () { change(k, 1); };
    q.appendChild(m); q.appendChild(n); q.appendChild(p); left.appendChild(q);
    var a = document.createElement("div"); a.className = "amt"; a.textContent = fmt(l.qty * l.price);
    d.appendChild(left); d.appendChild(a); box.appendChild(d);
  });

  $("addrBox").hidden = !t0.delivery;
  var total = t0.sub + t0.fee;
  $("sum").innerHTML = '<div><span>' + t("sub") + '</span><span>' + fmt(t0.sub) + '</span></div>' +
    (t0.delivery ? '<div><span>' + t("del") + '</span><span>' + fmt(t0.fee) + '</span></div>' : '') +
    '<div class="tot"><span>' + t("total") + '</span><span>' + fmt(total) + '</span></div>';

  var name = $("name").value.trim(), phone = $("phone").value.trim(), addr = $("addr").value.trim();
  var ok = t0.count > 0 && name && phone && (!t0.delivery || (addr && t0.sub >= MIN_ORDER));
  // Le message WhatsApp est toujours écrit en français, pour que la pizzeria reçoive un format unique
  var lines = keys.map(function (k) {
    var l = cart[k];
    return "• " + l.qty + " x " + l.it.n[0] + (l.si > -1 ? " (" + SIZES[l.si][0] + ")" : "") + " = " + fmtFR(l.qty * l.price);
  });
  var msg = "Bonjour, je souhaite commander :\n" + lines.join("\n") + "\n\n" +
    (t0.delivery ? "Livraison : " + fmtFR(t0.fee) + "\n" : "À emporter\n") + "Total : " + fmtFR(total) + "\n\n" +
    "Nom : " + name + "\nTéléphone : " + phone + (t0.delivery ? "\nAdresse : " + addr : "");
  var s = $("send");
  s.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg);
  s.setAttribute("aria-disabled", ok ? "false" : "true");
  s.textContent = (t0.delivery && t0.sub > 0 && t0.sub < MIN_ORDER) ? t("minMsg") + fmt(MIN_ORDER) : t("send");
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  applyStatic(); buildTabs(); showCat(); update();
}
document.querySelectorAll("[data-lang]").forEach(function (b) { b.onclick = function () { setLang(b.getAttribute("data-lang")); }; });

$("openCart").onclick = function () { $("sheet").hidden = false; $("bar").hidden = true; update(); };
$("closeCart").onclick = function () { $("sheet").hidden = true; update(); };
$("sheet").onclick = function (e) { if (e.target === $("sheet")) { $("sheet").hidden = true; update(); } };
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheet").hidden) { $("sheet").hidden = true; update(); } });
["name", "phone", "addr"].forEach(function (id) { $(id).addEventListener("input", update); });
document.querySelectorAll('input[name="mode"]').forEach(function (r) { r.addEventListener("change", update); });

setLang(lang);
</script>
